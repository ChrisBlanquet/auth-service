spring.application.name=auth

spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=https://prueba.vault.azure.net/

spring.datasource.url=${db-url}
spring.datasource.username=${db-user}
spring.datasource.password=${db-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Llave maestra 
jwt.rsa.private-key=${jwt-rsa-private-key}
jwt.rsa.public-key=${jwt-rsa-public-key}

# Tiempo de vida del token en milisegundos
app.jwt-expiration-milliseconds=900000

server.port=8080
eureka.instance.prefer-ip-address=true
##eureka.instance.ip-address=${azure-public-ip}
eureka.client.serviceUrl.defaultZone=http://${azure-public-ip}:8761/eureka/
#eureka.instance.instance-id=${spring.application.name}:${eureka.instance.ip-address}:${server.port}
eureka.instance.instance-id=${spring.application.name}:${random.value}

bot.security.username=${bot-user}
bot.security.password=${bot-password}

feign.circuitbreaker.enabled=true
resilience4j.retry.instances.gestionRetry.max-attempts=3
resilience4j.retry.instances.gestionRetry.wait-duration=500ms
resilience4j.retry.instances.gestionRetry.retry-exceptions=feign.FeignException,java.net.ConnectException

app.security.cookie.secure=false
app.security.cookie.same-site=Lax